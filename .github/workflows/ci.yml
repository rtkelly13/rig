name: CI

on:
  push:
    branches: [main]
  pull_request:
    # labeled: adding `ci:windows` to an open PR starts its Windows jobs without a new push.
    types: [opened, synchronize, reopened, labeled]
  workflow_dispatch:
  # Windows tests run nightly on main rather than on every merge.
  schedule:
    - cron: "43 3 * * *" # daily, 03:43 UTC (off the whole-hour rush)

concurrency:
  group: ci-${{ github.workflow }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions: {}

jobs:
  # Docs-only changes skip the heavy jobs here rather than through paths-ignore:
  # a workflow that never starts never reports the required `ci` check, so a
  # docs-only PR could not merge. The list below is a blocklist of documentation
  # paths: anything not matching it counts as code, so a new source folder runs CI
  # by default rather than being silently skipped.
  changes:
    name: changes
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      code: ${{ steps.diff.outputs.code }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Did anything besides docs change?
        id: diff
        env:
          EVENT: ${{ github.event_name }}
          PR_BASE: ${{ github.event.pull_request.base.sha }}
          PUSH_BEFORE: ${{ github.event.before }}
        run: |
          set -euo pipefail
          case "${EVENT}" in
            # A PR is compared from its merge base; a push compares its two endpoints
            # directly, so a force-push back to an ancestor still sees its changes.
            pull_request) base="${PR_BASE}"; range="${PR_BASE}...HEAD" ;;
            push) base="${PUSH_BEFORE}"; range="${PUSH_BEFORE}..HEAD" ;;
            *) echo "code=true" >> "${GITHUB_OUTPUT}"; exit 0 ;;
          esac
          if ! git cat-file -e "${base}^{commit}" 2>/dev/null; then
            echo "code=true" >> "${GITHUB_OUTPUT}"; exit 0
          fi
          code_files="$(git diff --name-only "${range}" \
            | grep -Ev '^(docs/|\.vscode/|skills/)|\.md$' || true)"
          if [ -n "${code_files}" ]; then
            echo "code=true" >> "${GITHUB_OUTPUT}"
          else
            echo "code=false" >> "${GITHUB_OUTPUT}"
          fi

  # One C# build for every job that needs the CLI: docs audit and
  # command-ownership previously compiled the same tree independently.
  build:
    name: build
    needs: changes
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest
    timeout-minutes: 8
    permissions:
      contents: read
    env:
      DOTNET_NOLOGO: "true"
      DOTNET_CLI_TELEMETRY_OPTOUT: "true"
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false
      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          global-json-file: global.json
      # Restore only: `analyze` alone saves, on main, so a PR never writes a 1 GB entry no other branch can read.
      # paket.lock fixes every package (ADR 0025), so project files stay out of the key. Linux builds copy only
      # the linux-x64 Playwright driver, so `analyze` deletes the other platforms' (~460 MB) before it saves.
      # Paket comes from the cache too, which is why the tool restore runs after it.
      - name: Restore NuGet cache
        id: nuget-cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.nuget/packages
          key: nuget-${{ runner.os }}-${{ hashFiles('paket.lock', '.config/dotnet-tools.json', 'global.json') }}
      # One Paket restore up front. Otherwise each MSBuild node in `dotnet restore` starts its own global
      # `paket restore` and they race on obj/: NuGet can read a project's references mid-write and restore
      # Rig.Core with no packages. PaketDisableGlobalRestore (an MSBuild property from the environment) stops
      # them; the first `dotnet restore` asks for one regardless, because obj/*.paket.props, which sets
      # PaketPropsVersion, only exists once NuGet has restored. PAKET_ERROR_ON_MSBUILD_EXEC fails any step
      # that would still need a per-project Paket restore, so the race cannot come back quietly.
      - name: Restore .NET tools and Paket packages
        run: |
          dotnet tool restore
          dotnet paket restore
          echo "PaketDisableGlobalRestore=true" >> "$GITHUB_ENV"
          echo "PAKET_ERROR_ON_MSBUILD_EXEC=true" >> "$GITHUB_ENV"
      # This job runs for docs-only PRs too: docs-audit and command-ownership both
      # consume these artifacts. Restore only the two projects they need in that case
      # instead of the whole solution, whose test projects never get built here.
      - name: Restore
        env:
          CODE_CHANGED: ${{ needs.changes.outputs.code }}
        run: |
          if [ "${CODE_CHANGED}" = "true" ]; then
            dotnet restore rig.slnx
          else
            # `dotnet restore` takes one target per invocation.
            dotnet restore src/Rig.Cli
            dotnet restore tools/command-ownership
          fi
      # Only the two artifacts other jobs consume, not every test project. `dotnet` still
      # builds the full solution for its tests in parallel. Analyzers stay off here: this
      # job only has to produce runnable output, and `analyze` runs them over the whole
      # solution. Cutting them takes this build from ~1m50 to ~1m.
      # No `-o`: it sends every project in the graph to one folder, so the Paket sidecar target copied the whole
      # CLI (Playwright, every SkiaSharp native) into paket/ beside it and the artifact doubled to ~450 MB zipped.
      - name: Build rig CLI
        run: dotnet build src/Rig.Cli -c Release --no-restore -p:RunAnalyzers=false
      - name: Build ownership tool
        run: >-
          dotnet build tools/command-ownership -c Release -o "${{ runner.temp }}/command-ownership"
          --no-restore -p:RunAnalyzers=false
      - name: Upload rig CLI
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        with:
          name: rig-cli
          # Every consumer runs on linux-x64: the Windows and macOS natives (~400 MB with SkiaSharp's PDBs) stay behind.
          path: |
            src/Rig.Cli/bin/Release/net11.0/
            !src/Rig.Cli/bin/Release/net11.0/**/runtimes/win-*/**
            !src/Rig.Cli/bin/Release/net11.0/**/runtimes/osx*/**
          retention-days: 1
          # The Playwright driver sits in the hidden .playwright folder; image-cross-check installs Chromium from it.
          include-hidden-files: true
      - name: Upload ownership tool
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        with:
          name: command-ownership
          path: ${{ runner.temp }}/command-ownership
          retention-days: 1

  lint:
    name: lint
    needs: changes
    # The nightly schedule exists for the Windows jobs; main's Linux jobs already ran on merge.
    if: github.event_name != 'schedule' && needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false
      - name: Verify no banned scripts (.sh / .ps1)
        uses: ls-lint/action@a87c5eb4fb26d7af1bd0adba203dd1e76f7e94eb # v2.3.2
      - uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7.6.0
        with:
          enable-cache: true
      # Workflow supply chain: SHA pins, credential persistence, permissions.
      # Offline audits only, so no token and no network beyond the install.
      - name: zizmor (workflow audit)
        run: uvx zizmor@1.31.1 --offline --format github .
      # The web assets (SPA bundle, every Tailwind stylesheet) are committed,
      # so rig can run without Node. Verify the
      # committed copies still match their sources rather than trusting them.
      - uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v4.4.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: pnpm
      # One install covers every workspace package (see pnpm-workspace.yaml):
      # the root Tailwind build and infra/vercel.
      - name: Install Node toolchains
        run: pnpm install --frozen-lockfile
      - name: Typecheck rig SPA
        run: pnpm web:typecheck
      - name: Verify committed web assets are current
        run: pnpm css:check
      # The Pulumi program is TypeScript in a C#-first repo, so nothing else
      # in this pipeline would ever compile it. Without this it rots silently
      # until someone runs `pulumi up` against live domains and finds out then.
      - name: Typecheck infra/vercel
        run: pnpm --filter infra-vercel typecheck

  # Runs on docs-only changes too, which lint skips: a dead link or an unindexed doc
  # is exactly what a docs-only PR introduces.
  docs-audit:
    name: docs-audit
    needs: build
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    env:
      DOTNET_NOLOGO: "true"
      DOTNET_CLI_TELEMETRY_OPTOUT: "true"
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false
      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          global-json-file: global.json
      - name: Download rig CLI
        uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7.0.0
        with:
          name: rig-cli
          path: ${{ runner.temp }}/rig-cli
      - name: AGENTS.md and docs audit
        run: dotnet "${{ runner.temp }}/rig-cli/rig.dll" repo-governance agents-audit . --strict

  # The brand-asset pipeline is its own uv project (tools/image-drift, ADR 0022): its own lock,
  # lint, types, security scan and coverage floor ([tool.coverage.report] in its pyproject).
  image-drift:
    name: image-drift
    needs: changes
    if: github.event_name != 'schedule' && needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 12
    permissions:
      contents: read
    defaults:
      run:
        working-directory: tools/image-drift
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7.6.0
        with:
          enable-cache: true
          cache-dependency-glob: tools/image-drift/uv.lock
      - name: Install dependencies
        run: uv sync --locked --dev
      - name: Lint
        run: |
          uv run ruff check .
          uv run ruff format --check .
      - name: Types
        run: |
          uv run basedpyright
          uv run ty check src
      - name: Security scan
        run: uv run bandit -r src/ -ll
      # Keyed on the playwright package version, which pins Chromium, not on the whole lock.
      - name: Read the pinned Playwright version
        id: playwright-version
        run: |
          version="$(sed -n '/^name = "playwright"/{n;s/^version = "\([^"]*\)".*/\1/p;}' uv.lock)"
          test -n "${version}"
          echo "version=${version}" >> "${GITHUB_OUTPUT}"
      - name: Cache Playwright Chromium
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        id: playwright-cache
        with:
          path: ~/.cache/ms-playwright
          key: playwright-linux-${{ steps.playwright-version.outputs.version }}
      - name: Install Playwright Chromium
        if: steps.playwright-cache.outputs.cache-hit != 'true'
        run: uv run playwright install --with-deps chromium
      - name: Run tests with coverage
        run: uv run pytest -n auto --durations=10 --cov=src --cov-report=term-missing

  image-drift-windows:
    name: image-drift-windows
    needs: changes
    runs-on: windows-latest
    timeout-minutes: 15
    # Opt-in: nightly, workflow_dispatch, a windows/win32 title or branch, or 'ci:windows'.
    if: |
      needs.changes.outputs.code == 'true' && (
      github.event_name == 'schedule' ||
      github.event_name == 'workflow_dispatch' ||
      contains(github.event.pull_request.title, '[windows]') ||
      contains(github.event.pull_request.title, 'win32') ||
      contains(github.head_ref, 'windows') ||
      contains(github.head_ref, 'win32') ||
      contains(github.event.pull_request.labels.*.name, 'ci:windows'))
    permissions:
      contents: read
    defaults:
      run:
        working-directory: tools/image-drift
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7.6.0
        with:
          enable-cache: true
          cache-dependency-glob: tools/image-drift/uv.lock
      - name: Install dependencies
        run: uv sync --locked --dev
      - name: Read the pinned Playwright version
        id: playwright-version
        shell: bash
        run: |
          version="$(sed -n '/^name = "playwright"/{n;s/^version = "\([^"]*\)".*/\1/p;}' uv.lock)"
          test -n "${version}"
          echo "version=${version}" >> "${GITHUB_OUTPUT}"
      - name: Cache Playwright Chromium
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        id: playwright-cache-win
        with:
          path: ~\AppData\Local\ms-playwright
          key: playwright-windows-${{ steps.playwright-version.outputs.version }}
      - name: Install Playwright Chromium
        if: steps.playwright-cache-win.outputs.cache-hit != 'true'
        run: uv run playwright install chromium
      - name: Run tests
        run: uv run pytest -p no:cacheprovider --basetemp="${{ runner.temp }}/pytest" -ra

  # The C# side (ADR 0022): build with warnings as errors, tests, the coverage ratchet.
  # Formatting runs in the parallel `format` job.
  # The C# gate, sharded across runners: one job built every project and then ran every
  # test (build ~2m17 + tests ~1m05), and the build was the wall clock. Each shard builds
  # only the projects it tests, so the shards run in parallel. Coverage is unioned by
  # scripts/coverage-floor.cs across the shards' coverlet reports, which keep each line
  # and branch identity, so the floor still measures the whole codebase.
  dotnet:
    name: dotnet (${{ matrix.shard }})
    needs: changes
    if: github.event_name != 'schedule' && needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    env:
      DOTNET_NOLOGO: "true"
      DOTNET_CLI_TELEMETRY_OPTOUT: "true"
      PROJECTS: ${{ matrix.projects }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # Rig.Core is the largest project and Rig.Core.Tests the largest suite.
          - shard: core
            projects: tests/Rig.Core.Tests/Rig.Core.Tests.csproj
          # Everything else pulls in every product project: Rig.Specs and the architecture
          # tests reference the CLI and the launcher, the ownership tests the tool.
          - shard: app
            projects: >-
              tests/Rig.Architecture.Tests/Rig.Architecture.Tests.csproj
              tests/Rig.Cli.Tests/Rig.Cli.Tests.csproj
              tests/Rig.CommandOwnership.Tests/Rig.CommandOwnership.Tests.csproj
              tests/Rig.LocReport.Tests/Rig.LocReport.Tests.csproj
              tests/Rig.Specs/Rig.Specs.csproj
              tests/Rig.Web.Tests/Rig.Web.Tests.csproj
          # The image oracle tests take ~2m under coverage, as long as Rig.Cli.Tests; serial in app they pushed it to ~8m of a 10m timeout.
          - shard: image
            projects: tests/Rig.Image.Tests/Rig.Image.Tests.csproj
          # The SPA tests and the image renderer's tests drive headless Chromium through Playwright.
          - shard: browser
            projects: >-
              tests/Rig.Web.BrowserTests/Rig.Web.BrowserTests.csproj
              tests/Rig.Image.BrowserTests/Rig.Image.BrowserTests.csproj
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false
      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          global-json-file: global.json
      # Restore only: `analyze` alone saves, on main, so a PR never writes a 1 GB entry no other branch can read.
      # paket.lock fixes every package (ADR 0025), so project files stay out of the key. Linux builds copy only
      # the linux-x64 Playwright driver, so `analyze` deletes the other platforms' (~460 MB) before it saves.
      # Paket comes from the cache too, which is why the tool restore runs after it.
      - name: Restore NuGet cache
        id: nuget-cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.nuget/packages
          key: nuget-${{ runner.os }}-${{ hashFiles('paket.lock', '.config/dotnet-tools.json', 'global.json') }}
      # One Paket restore up front. Otherwise each MSBuild node in `dotnet restore` starts its own global
      # `paket restore` and they race on obj/: NuGet can read a project's references mid-write and restore
      # Rig.Core with no packages. PaketDisableGlobalRestore (an MSBuild property from the environment) stops
      # them; the first `dotnet restore` asks for one regardless, because obj/*.paket.props, which sets
      # PaketPropsVersion, only exists once NuGet has restored. PAKET_ERROR_ON_MSBUILD_EXEC fails any step
      # that would still need a per-project Paket restore, so the race cannot come back quietly.
      - name: Restore .NET tools and Paket packages
        run: |
          dotnet tool restore
          dotnet paket restore
          echo "PaketDisableGlobalRestore=true" >> "$GITHUB_ENV"
          echo "PAKET_ERROR_ON_MSBUILD_EXEC=true" >> "$GITHUB_ENV"
      - name: Restore
        run: dotnet restore rig.slnx
      # Analyzers are two thirds of compile time and `analyze` runs them once over the whole
      # solution, so the shards skip them rather than each re-analyzing Rig.Core.
      - name: Build
        run: |
          set -euo pipefail
          for project in $PROJECTS; do
            dotnet build "$project" --no-restore -c Release -p:RunAnalyzers=false
          done
      # Cache Playwright's browser binaries to avoid the download on every run. The package version pins the
      # Chromium revision, so the key is that version alone: an unrelated paket.lock bump keeps the cache.
      - name: Read the pinned Playwright version
        if: matrix.shard == 'browser'
        id: playwright-version
        run: |
          version="$(sed -n 's/^ *Microsoft\.Playwright (\([^)]*\)).*/\1/p' paket.lock | head -n 1)"
          test -n "${version}"
          echo "version=${version}" >> "${GITHUB_OUTPUT}"
      - name: Cache Playwright Chromium
        if: matrix.shard == 'browser'
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        id: playwright-cache
        with:
          path: ~/.cache/ms-playwright
          key: playwright-dotnet-linux-${{ steps.playwright-version.outputs.version }}
      - name: Install Playwright Chromium
        if: matrix.shard == 'browser' && steps.playwright-cache.outputs.cache-hit != 'true'
        run: pwsh tests/Rig.Web.BrowserTests/bin/Release/net11.0/playwright.ps1 install --with-deps chromium
      # The COM source generator's stubs and CsWin32's interop (Desktop/Windows) are Windows-only and generated, so
      # they are left out like the [ExcludeFromCodeCoverage] interop they serve; the Windows job exercises them.
      - name: Test with coverage
        run: |
          set -euo pipefail
          for project in $PROJECTS; do
            dotnet test --project "$project" --no-build -c Release --report-trx --coverlet --coverlet-output-format json \
              --coverlet-exclude-by-file "**/Microsoft.Interop.ComInterfaceGenerator/**" \
              --coverlet-exclude-by-file "**/Microsoft.Windows.CsWin32/**"
          done
      - name: Upload coverage report
        if: always() && hashFiles('TestResults/coverage.*.json') != ''
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        with:
          name: dotnet-coverage-${{ matrix.shard }}
          path: TestResults/coverage.*.json
          retention-days: 1
      # One TRX per test project: per-test durations, so a slow run names its slow tests.
      - name: Upload test results
        if: always() && hashFiles('TestResults/*.trx') != ''
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        with:
          name: dotnet-trx-${{ matrix.shard }}
          path: TestResults/*.trx
          retention-days: 14

  # Warnings are errors with every analyzer on (ADR 0022). One build of the whole solution here
  # enforces them for every project, so `build` and the `dotnet` shards compile without them.
  analyze:
    name: analyze
    needs: changes
    if: github.event_name != 'schedule' && needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    env:
      DOTNET_NOLOGO: "true"
      DOTNET_CLI_TELEMETRY_OPTOUT: "true"
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false
      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          global-json-file: global.json
      # Restore only: `analyze` alone saves, on main, so a PR never writes a 1 GB entry no other branch can read.
      # paket.lock fixes every package (ADR 0025), so project files stay out of the key. Linux builds copy only
      # the linux-x64 Playwright driver, so `analyze` deletes the other platforms' (~460 MB) before it saves.
      # Paket comes from the cache too, which is why the tool restore runs after it.
      - name: Restore NuGet cache
        id: nuget-cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.nuget/packages
          key: nuget-${{ runner.os }}-${{ hashFiles('paket.lock', '.config/dotnet-tools.json', 'global.json') }}
      # One Paket restore up front. Otherwise each MSBuild node in `dotnet restore` starts its own global
      # `paket restore` and they race on obj/: NuGet can read a project's references mid-write and restore
      # Rig.Core with no packages. PaketDisableGlobalRestore (an MSBuild property from the environment) stops
      # them; the first `dotnet restore` asks for one regardless, because obj/*.paket.props, which sets
      # PaketPropsVersion, only exists once NuGet has restored. PAKET_ERROR_ON_MSBUILD_EXEC fails any step
      # that would still need a per-project Paket restore, so the race cannot come back quietly.
      - name: Restore .NET tools and Paket packages
        run: |
          dotnet tool restore
          dotnet paket restore
          echo "PaketDisableGlobalRestore=true" >> "$GITHUB_ENV"
          echo "PAKET_ERROR_ON_MSBUILD_EXEC=true" >> "$GITHUB_ENV"
      - name: Restore
        run: dotnet restore rig.slnx
      # The one writer of the NuGet cache: this job restores the whole solution, and only main's entry is
      # readable by every PR. Saved before the build, so a failing build still leaves the packages behind.
      # Not a `!` path exclusion: the cache tars the whole folder, so exclusions under it are ignored.
      - name: Drop the other platforms' Playwright drivers
        if: github.event_name == 'push' && steps.nuget-cache.outputs.cache-hit != 'true'
        run: rm -rf ~/.nuget/packages/microsoft.playwright/*/.playwright/node/{darwin-*,linux-arm64,win32_x64}
      - name: Save NuGet cache
        if: github.event_name == 'push' && steps.nuget-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.nuget/packages
          key: ${{ steps.nuget-cache.outputs.cache-primary-key }}
      - name: Build with analyzers
        run: dotnet build rig.slnx --no-restore -c Release

  # A ratchet: the floor never falls, must follow coverage up to 95%. It reads
  # every shard's report, so the split above cannot lower the measured number.
  dotnet-coverage:
    name: dotnet-coverage
    needs: [changes, dotnet]
    if: github.event_name != 'schedule' && needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    env:
      DOTNET_NOLOGO: "true"
      DOTNET_CLI_TELEMETRY_OPTOUT: "true"
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false
      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          global-json-file: global.json
      - name: Download coverage reports
        uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7.0.0
        with:
          pattern: dotnet-coverage-*
          path: TestResults
          merge-multiple: true
      - name: Fetch the base branch's coverage floor
        if: github.event_name == 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          gh api "repos/${GITHUB_REPOSITORY}/contents/Directory.Build.props?ref=${BASE_SHA}" \
            -H "Accept: application/vnd.github.raw" > base-Directory.Build.props || rm -f base-Directory.Build.props
      - name: Coverage floor ratchet
        run: dotnet run scripts/coverage-floor.cs -- TestResults/coverage.*.json --base-props base-Directory.Build.props

  # Formatting is independent of the build/test critical path. PRs check only changed C#
  # files; a formatting-config change or a push runs the full solution.
  format:
    name: format
    needs: changes
    if: github.event_name != 'schedule' && needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 8
    permissions:
      contents: read
    env:
      DOTNET_NOLOGO: "true"
      DOTNET_CLI_TELEMETRY_OPTOUT: "true"
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          global-json-file: global.json
      # Restore only: `analyze` alone saves, on main, so a PR never writes a 1 GB entry no other branch can read.
      # paket.lock fixes every package (ADR 0025), so project files stay out of the key. Linux builds copy only
      # the linux-x64 Playwright driver, so `analyze` deletes the other platforms' (~460 MB) before it saves.
      # Paket comes from the cache too, which is why the tool restore runs after it.
      - name: Restore NuGet cache
        id: nuget-cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.nuget/packages
          key: nuget-${{ runner.os }}-${{ hashFiles('paket.lock', '.config/dotnet-tools.json', 'global.json') }}
      # One Paket restore up front. Otherwise each MSBuild node in `dotnet restore` starts its own global
      # `paket restore` and they race on obj/: NuGet can read a project's references mid-write and restore
      # Rig.Core with no packages. PaketDisableGlobalRestore (an MSBuild property from the environment) stops
      # them; the first `dotnet restore` asks for one regardless, because obj/*.paket.props, which sets
      # PaketPropsVersion, only exists once NuGet has restored. PAKET_ERROR_ON_MSBUILD_EXEC fails any step
      # that would still need a per-project Paket restore, so the race cannot come back quietly.
      - name: Restore .NET tools and Paket packages
        run: |
          dotnet tool restore
          dotnet paket restore
          echo "PaketDisableGlobalRestore=true" >> "$GITHUB_ENV"
          echo "PAKET_ERROR_ON_MSBUILD_EXEC=true" >> "$GITHUB_ENV"
      - name: Restore
        run: dotnet restore rig.slnx
      - name: Format changed files
        env:
          EVENT: ${{ github.event_name }}
          PR_BASE: ${{ github.event.pull_request.base.sha }}
        run: |
          set -euo pipefail
          full() { dotnet format rig.slnx --no-restore --verify-no-changes; }
          if [ "${EVENT}" != "pull_request" ]; then
            full
            exit 0
          fi
          base="${PR_BASE}"
          if ! git cat-file -e "${base}^{commit}" 2>/dev/null; then
            full
            exit 0
          fi
          range="${base}...HEAD"
          if git diff --name-only --no-renames "${range}" | grep -Eq '(^|/)(\.editorconfig|\.globalconfig|Directory\.Build\.props|Directory\.Build\.targets|paket\.dependencies|paket\.lock)$'; then
            full
            exit 0
          fi
          mapfile -d '' -t files < <(git diff --name-only -z --no-renames --diff-filter=ACMRT "${range}" -- '*.cs')
          if [ "${#files[@]}" -eq 0 ]; then
            echo "No C# files changed"
            exit 0
          fi
          dotnet format rig.slnx --no-restore --verify-no-changes --include "${files[@]}"

  # Windows runs only nightly or on opt-in: the desktop port's Win32 code lands here.
  dotnet-windows:
    name: dotnet-windows
    needs: changes
    runs-on: windows-latest
    timeout-minutes: 25
    if: |
      needs.changes.outputs.code == 'true' && (
      github.event_name == 'schedule' ||
      github.event_name == 'workflow_dispatch' ||
      contains(github.event.pull_request.title, '[windows]') ||
      contains(github.event.pull_request.title, 'win32') ||
      contains(github.head_ref, 'windows') ||
      contains(github.head_ref, 'win32') ||
      contains(github.event.pull_request.labels.*.name, 'ci:windows'))
    permissions:
      contents: read
    env:
      DOTNET_NOLOGO: "true"
      DOTNET_CLI_TELEMETRY_OPTOUT: "true"
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false
      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          global-json-file: global.json
      - name: Restore .NET tools (Paket)
        run: dotnet tool restore
      - name: Build
        run: dotnet build rig.slnx -c Release
      - name: Read the pinned Playwright version
        id: playwright-version
        shell: bash
        run: |
          version="$(sed -n 's/^ *Microsoft\.Playwright (\([^)]*\)).*/\1/p' paket.lock | head -n 1)"
          test -n "${version}"
          echo "version=${version}" >> "${GITHUB_OUTPUT}"
      - name: Cache Playwright Chromium
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        id: playwright-cache
        with:
          path: ~\AppData\Local\ms-playwright
          key: playwright-dotnet-windows-${{ steps.playwright-version.outputs.version }}
      - name: Install Playwright Chromium
        if: steps.playwright-cache.outputs.cache-hit != 'true'
        run: pwsh tests/Rig.Web.BrowserTests/bin/Release/net11.0/playwright.ps1 install chromium
      # One test module at a time: every module starting git at once on the 4-core runner pushed single git calls
      # past their 10-30s timeouts, failing a different git-backed test on each run.
      - name: Test
        run: dotnet test --solution rig.slnx --no-build -c Release --max-parallel-test-modules 1

  # The nightly run is the only routine Windows check, so its result has to reach someone: a failure opens (or
  # comments on) one tracking issue, and the next green night closes it. Not part of `ci`: it never runs on a PR.
  windows-nightly-alarm:
    name: windows-nightly-alarm
    needs: [image-drift-windows, dotnet-windows]
    if: always() && github.event_name == 'schedule'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      issues: write
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      TITLE: Windows nightly regression
      RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
      SHA: ${{ github.sha }}
      IMAGE_DRIFT_RESULT: ${{ needs.image-drift-windows.result }}
      DOTNET_RESULT: ${{ needs.dotnet-windows.result }}
    steps:
      - name: Open, update or close the tracking issue
        run: |
          # Search by title server-side before the limit applies; the exact match drops near-misses.
          open="$(gh issue list --state open --search "\"$TITLE\" in:title" --limit 20 --json number,title \
            --jq '.[] | select(.title == env.TITLE) | .number' | head -n 1)"
          summary="image-drift-windows: \`$IMAGE_DRIFT_RESULT\`, dotnet-windows: \`$DOTNET_RESULT\` at $SHA — $RUN_URL"
          case "$IMAGE_DRIFT_RESULT $DOTNET_RESULT" in
            *failure*|*cancelled*)
              if [ -n "$open" ]; then
                gh issue comment "$open" --body "Still failing. $summary"
              else
                gh issue create --title "$TITLE" --body "The nightly Windows run failed. $summary

          Windows jobs only run nightly and on opted-in PRs (label \`ci:windows\`), so this is the alarm for everything merged since the last green night. This issue closes itself on the next green night."
              fi
              ;;
            "success success")
              if [ -n "$open" ]; then
                gh issue close "$open" --comment "Green again. $summary"
              fi
              ;;
          esac

  # Report only (ADR 0024, #321): renders the masters with Chromium and Svg.Skia and reports how far they diverge.
  # Not in `ci`'s needs, so it never blocks a PR; the Chromium-dependent tests that do block run in the browser shard.
  # A docs-only change cannot move a renderer, so it skips this with the other code jobs.
  image-cross-check:
    name: image-cross-check
    needs: [changes, build]
    if: github.event_name != 'schedule' && needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    continue-on-error: true
    timeout-minutes: 10
    permissions:
      contents: read
    env:
      DOTNET_NOLOGO: "true"
      DOTNET_CLI_TELEMETRY_OPTOUT: "true"
      RIG_HOME: ${{ github.workspace }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false
      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          global-json-file: global.json
      - name: Restore .NET tools (Paket)
        run: dotnet tool restore
      - name: Download rig CLI
        uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7.0.0
        with:
          name: rig-cli
          path: ${{ runner.temp }}/rig-cli
      - name: Read the pinned Playwright version
        id: playwright-version
        run: |
          version="$(sed -n 's/^ *Microsoft\.Playwright (\([^)]*\)).*/\1/p' paket.lock | head -n 1)"
          test -n "${version}"
          echo "version=${version}" >> "${GITHUB_OUTPUT}"
      - name: Cache Playwright Chromium
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        id: playwright-cache
        with:
          path: ~/.cache/ms-playwright
          key: playwright-dotnet-linux-${{ steps.playwright-version.outputs.version }}
      # upload-artifact drops file modes, and the install below runs this node driver, so restore its bit first.
      - name: Restore the Playwright driver's execute bit
        run: chmod +x "${{ runner.temp }}/rig-cli/.playwright/node/linux-x64/node"
      # shell: pwsh runs with $ErrorActionPreference = 'stop', so a failed install fails the step instead of the cross-check.
      - name: Install Playwright Chromium
        if: steps.playwright-cache.outputs.cache-hit != 'true'
        shell: pwsh
        run: |
          & "${{ runner.temp }}/rig-cli/playwright.ps1" install --with-deps chromium
      - name: Cross-check the renderers
        run: >-
          dotnet "${{ runner.temp }}/rig-cli/rig.dll" image cross-check
          --candidates tests/Rig.Image.Tests/Oracle/candidates
          --report "${{ runner.temp }}/cross-check.json"
      - name: Upload report
        if: always()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        with:
          name: image-cross-check
          path: ${{ runner.temp }}/cross-check.json
          if-no-files-found: ignore
          retention-days: 14

  # Always inspect GitHub's merged result, even for a docs-only PR: a concurrent
  # port must not leave two owners after each branch's individual tests passed.
  command-ownership:
    name: command-ownership
    needs: build
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          global-json-file: global.json
      - name: Restore .NET tools (Paket)
        run: dotnet tool restore
      - name: Download rig CLI
        uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7.0.0
        with:
          name: rig-cli
          path: ${{ runner.temp }}/rig-cli
      - name: Download ownership tool
        uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7.0.0
        with:
          name: command-ownership
          path: ${{ runner.temp }}/command-ownership
      - name: Inspect registrations and enforce one owner
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before || 'origin/main' }}
        run: >-
          dotnet "${{ runner.temp }}/command-ownership/CommandOwnership.dll"
          . "${{ runner.temp }}/rig-cli/rig.dll" --base "$BASE_SHA"
      - name: Require current main in the tested merge result
        if: github.event_name == 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          current_main="$(gh api "repos/${GITHUB_REPOSITORY}/git/ref/heads/main" --jq .object.sha)"
          git merge-base --is-ancestor "$current_main" HEAD

  # Report only: never a gate, and `ci` does not need it. Its failure cannot block a merge.
  # SHORT-TERM: replaced by `diffra record --name loc` once rtkelly-labs/Diffra#159 ships; delete with #320.
  loc-report:
    name: loc-report
    needs: changes
    if: github.event_name != 'schedule' && needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    env:
      DOTNET_NOLOGO: "true"
      DOTNET_CLI_TELEMETRY_OPTOUT: "true"
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false
      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          global-json-file: global.json
      - name: Restore .NET tools (Paket)
        run: dotnet tool restore
      - name: Build the report tool
        continue-on-error: true
        run: dotnet build tools/loc-report -v q
      # tee: the table lands in the job summary and in the log, so the numbers can be read back.
      - name: Report C# lines per area and Python carry-overs
        continue-on-error: true
        run: dotnet run --project tools/loc-report --no-build -- . --markdown | tee -a "$GITHUB_STEP_SUMMARY"

  ci:
    name: ci
    if: always()
    needs: [changes, build, format, lint, docs-audit, image-drift, image-drift-windows, analyze, dotnet, dotnet-coverage, dotnet-windows, command-ownership]
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false
      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          global-json-file: global.json
      - name: Verify all required jobs succeeded
        env:
          NEEDS_JSON: ${{ toJSON(needs) }}
        run: dotnet run scripts/require-jobs-succeeded.cs
