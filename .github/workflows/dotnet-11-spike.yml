# Wave F Phase 0 (#30): evidence that the existing net10.0 tree builds and tests on the
# .NET 11 SDK, with no target, package or production change. A separate workflow, never a
# job in ci.yml: it cannot gate `ci`, and no required check includes it.
#
# Phase 1 (committing 11.0.100 to global.json and retargeting to net11.0) stays a separate
# decision; see #30.
name: dotnet-11-spike

on:
  workflow_dispatch:
  # Optional path for a retarget branch: add the `dotnet-11` label to an open PR.
  pull_request:
    types: [opened, synchronize, reopened, labeled]

permissions:
  contents: read

jobs:
  dotnet-11-spike:
    name: dotnet-11-spike
    if: >-
      github.event_name == 'workflow_dispatch' ||
      contains(github.event.pull_request.labels.*.name, 'dotnet-11')
    runs-on: ubuntu-latest
    timeout-minutes: 35
    permissions:
      contents: read
    env:
      DOTNET_NOLOGO: "true"
      DOTNET_CLI_TELEMETRY_OPTOUT: "true"
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      # Deliberately no global-json-file: the committed file pins the .NET 10 SDK and must
      # not select the toolchain here.
      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: 11.0.x
      # The SDK is the only variable under test, so the checkout's global.json is replaced for
      # the life of the job rather than committed: same shape, the test runner stays MTP.
      - name: Pin the .NET 11 SDK for this job
        run: |
          set -euo pipefail
          cp global.json global.json.committed
          cat > global.json <<'JSON'
          {
            "sdk": {
              "version": "11.0.100",
              "rollForward": "latestFeature"
            },
            "test": {
              "runner": "Microsoft.Testing.Platform"
            }
          }
          JSON
      - name: Show the SDK in use
        run: |
          set -euo pipefail
          dotnet --info
          dotnet --version | grep -q '^11\.'
      - name: Build
        run: dotnet build rig.slnx -c Release -m:2
      # xunit.v3.mtp-v2 4.0.3 brings Microsoft.Testing.Platform 2.5.2, so the .NET 11-only
      # whole-run options are available (both require MTP 2.4 or later). The cap keeps a
      # badly broken run from spending the whole timeout; 100 is well above a real signal.
      - name: Test
        run: >-
          dotnet test --solution rig.slnx -c Release --no-build
          --timeout 20m --maximum-failed-tests 100
      - name: Restore the committed global.json
        if: always()
        run: mv global.json.committed global.json
