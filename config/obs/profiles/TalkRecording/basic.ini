; OBS profile for recording live talks on an Apple-silicon MacBook Air.
; Managed in shared-utilities — see config/obs/install.sh and docs/obs-recording.md.
;
; Design notes:
;  - Simple output, LOCAL RECORDING ONLY. No stream key / RTMP, so nothing
;    touches the network mid-demo (the machine has 8 GB RAM and no second box).
;  - RecEncoder=apple_h264 is the VideoToolbox HARDWARE H264 encoder. It runs on
;    the M1 media engine, so encoding barely touches the CPU cores the live demo
;    needs. Never switch this to x264 (software) on this machine.
;  - RecFormat2=mkv so an OBS crash mid-talk leaves a playable file. Remux to MP4
;    afterwards (OBS: File > Remux Recordings) before uploading to YouTube.
;  - RecQuality=Small is OBS's "High Quality, Medium File Size" preset: crisp
;    enough for slide text and code demos, ~4-5 GB/hour (kind to a small SSD).
;    Switch to HQ for maximum fidelity if you have the disk.
;  - 1080p30. Do NOT raise to 1080p60 / 4K: a fanless Air will throttle and swap.

[General]
Name=TalkRecording

[Output]
Mode=Simple
FilenameFormatting=%CCYY-%MM-%DD %hh-%mm-%ss talk

[SimpleOutput]
FilePath=__RECORD_PATH__
RecFormat2=mkv
RecEncoder=apple_h264
RecQuality=Small
RecAudioEncoder=aac
RecTracks=1
VBitrate=6000
ABitrate=160
UseAdvanced=false
RecRB=false

[Video]
BaseCX=1920
BaseCY=1080
OutputCX=1920
OutputCY=1080
FPSType=1
FPSInt=30
FPSNum=30
FPSDen=1
ScaleType=bicubic
ColorFormat=NV12
ColorSpace=709
ColorRange=Partial
SdrWhiteLevel=300
HdrNominalPeakLevel=1000

[Audio]
MonitoringDeviceId=default
MonitoringDeviceName=Default
SampleRate=48000
ChannelSetup=Stereo
