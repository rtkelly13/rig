    <article class="panel card-shadow relative flex flex-col items-center p-5{{chosen_class}}">
{{ribbon_html}}
      <h3 class="mt-3 mb-1.5 text-center text-body text-content-primary">{{name}}</h3>
      <p class="mb-3 min-h-8.5 text-center text-caption text-content-secondary">{{description}}</p>
      <img class="size-52.5 rounded-xl object-contain" src="{{hero}}" alt="{{alt}}">
      <div class="{{badge_class}}">
        Composite: {{composite}}%
      </div>
      <div class="mt-1.5 text-caption text-content-muted">Full frame: {{full_frame}}%</div>
    </article>
