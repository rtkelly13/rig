[project]
name = "rig"
version = "0.1.0"
description = "Personal developer rig — multi-agent launcher, estate governance, desktop IaC, and tooling cockpit"
readme = "README.md"
authors = [
    { name = "Ryan Kelly", email = "94ryan.kelly@gmail.com" }
]
requires-python = ">=3.13,<3.14"
dependencies = [
    "click>=8.1.0",
    "mdformat>=1.0.0",
    "httpx>=0.28.0",
    "python-frontmatter>=1.0.0",
    "jinja2>=3.1.6",
    "numpy>=2.5.1",
    "pillow>=12.3.0",
    "playwright>=1.62.0",
    "pydantic>=2.12.5",
    "pyvda>=0.5.0; sys_platform == 'win32'",
    "rich>=14.2.0",
    "svgwrite>=1.4.3",
    "typer>=0.21.1",
    "pyyaml>=6.0.2",
    "scour>=0.38.2",
    "shapely>=2.0.0",
    "vtracer>=0.6.15",
    "defusedxml>=0.7.1",
    "duckdb>=1.5.5",
    "comtypes>=1.4.16; sys_platform == 'win32'",
    "pywin32>=311; sys_platform == 'win32'",
    "type-ratchet",
    "platformdirs>=4.3",
    "mcp>=2.3.0",
    "markdown-it-py>=4.0.0",
]

[project.scripts]
rig = "rig.rig_cli:main"
desktop-manager = "desktop_manager.cli:main"
estate = "rig.estate.cli:main"
otel-stack = "rig.csharp_cli:entry"
help = "desktop_manager.cli:help_main"
status = "rig.csharp_cli:entry"
agent = "rig.csharp_cli:entry"
image-reconcile = "rig.image_drift.cli:main"
vault = "rig.csharp_cli:entry"
md-lint = "rig.csharp_cli:entry"
repo-governance = "rig.repo_governance.align_repo_conventions:main"
workspace = "rig.workspace.cli:main"
devenv = "rig.devenv.cli:main"
latex = "rig.csharp_cli:entry"
mail = "rig.csharp_cli:entry"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.uv]
required-environments = [
    "sys_platform == 'win32'",
    "sys_platform == 'linux'",
]

[tool.uv.workspace]
members = ["packages/type-ratchet"]

[tool.uv.sources]
type-ratchet = { workspace = true }

[tool.hatch.build.targets.wheel]
packages = ["src/desktop_manager", "src/rig", "src/shared_utilities"]

[tool.hatch.build.targets.wheel.force-include]
# The installed chrome-tabs snapshot has no checkout; site_hosts falls back to this copy.
"config/chrome-site-groups.json" = "desktop_manager/chrome/chrome-site-groups.json"

[tool.pytest.ini_options]
testpaths = ["tests", "packages/type-ratchet/tests"]
pythonpath = ["src"]
addopts = "-ra"
# Per-test cap (pytest-timeout): a hang fails one test with a stack trace instead of
# silently eating the job's timeout-minutes. The slowest test took 54s under -n auto on an
# 8-core Mac on 2026-11-04; 4-vCPU CI runners are slower, so the cap catches hangs, not slowness.
timeout = 300
markers = [
    "ci: no external dependencies — safe to run in CI",
    "windows: requires Windows OS with win32 APIs",
    "macos: requires macOS with Chrome scripting and accessibility",
    "integration: requires live system state (open windows, virtual desktops)",
    "property: Hypothesis property-based test (applied automatically in tests/conftest.py)",
    "bdd: pytest-bdd scenario driven by a .feature file (applied automatically)",
]

[dependency-groups]
dev = [
    "deepdiff>=8.6.1",
    "types-pyyaml>=6.0.12",
    "ty>=0.0.84",
    "pytest>=9.0.2",
    "pytest-xdist>=3.0.0",
    "inline-snapshot>=0.18.0",
    "ruff>=0.9.9",
    "coverage>=7.6.12",
    "pytest-cov>=6.0.0",
    "bandit>=1.8.3",
    "mdformat-ruff>=0.1.3",
    "mdformat-frontmatter>=2.0.10",
    "pre-commit>=4.0.0",
    "types-defusedxml>=0.7.0.20260504",
    "basedpyright>=1.40.2",
    "types-pywin32>=312.0.0.20261006",
    "import-linter>=2.15",
    "hypothesis>=6.140",
    "pytest-timeout>=2.3",
    "pytest-bdd>=8.1.0",
]

[tool.importlinter]
root_packages = ["rig", "desktop_manager"]
include_external_packages = false

[[tool.importlinter.contracts]]
id = "top-layers"
name = "desktop_manager sits above rig"
type = "layers"
layers = ["desktop_manager", "rig"]
# Today's violations (plan item G1, #30). Each entry names the item that removes it;
# G3 deletes every ignore_imports list.
ignore_imports = [
    "rig.estate.apps_windows -> desktop_manager.win32.dlls",  # G2
    "rig.rig_cli -> desktop_manager.cli",  # G2 (composition root, allowed explicitly)
    "rig.rig_cli -> desktop_manager.web_cli",  # G2 (composition root, allowed explicitly)
    "rig.otel_stack.backfill -> desktop_manager.runtime",  # B1 (roots.app_data_dir)
]

[[tool.importlinter.contracts]]
id = "acyclic-siblings"
name = "rig and desktop_manager subpackages are acyclic"
type = "acyclic_siblings"
ancestors = ["rig", "desktop_manager"]
# A minimal cut set: every entry is needed for the contract to pass. Each names the item that removes it.
ignore_imports = [
    "rig.workspace.ci_cli -> rig.estate.ci_telemetry",  # G2 (move the module)
    "rig.workspace.cli -> rig.repo_governance.gitignore_manager",  # G2 (mount from rig_cli)
    "rig.workspace.nuget_governance -> rig.repo_governance.workflow_yaml",  # G2
    "desktop_manager.work.sessions -> desktop_manager.claude_sessions.discovery",  # G2
    "desktop_manager.work.sessions -> desktop_manager.claude_sessions.folders",  # G2
]

[[tool.importlinter.contracts]]
id = "win32-adapters"
name = "win32 adapters do not import features"
type = "forbidden"
source_modules = ["desktop_manager.win32"]
forbidden_modules = [
    "desktop_manager.chrome",
    "desktop_manager.claude_sessions",
    "desktop_manager.commands",
    "desktop_manager.handlers",
    "desktop_manager.jobs",
    "desktop_manager.queries",
    "desktop_manager.work",
    "desktop_manager.placement",
    "desktop_manager.desktop_reconcile",
    "desktop_manager.restore",
    "desktop_manager.cli",
]
ignore_imports = [
]

[[tool.importlinter.contracts]]
id = "rig-features"
name = "rig features are independent"
type = "independence"
modules = [
    "rig.estate",
    "rig.workspace",
    "rig.repo_governance",
    "rig.image_drift",
    "rig.devenv",
]
ignore_imports = [
    "rig.image_drift.server -> rig.workspace.engine",  # G2
    "rig.workspace.ci_cli -> rig.estate.ci_telemetry",  # G2 (move the module)
    "rig.workspace.cli -> rig.devenv.ui",  # G2 (shared console helpers to a leaf module)
    "rig.workspace.cli -> rig.repo_governance.gitignore_manager",  # G2 (mount from rig_cli)
    "rig.workspace.nuget_governance -> rig.repo_governance.workflow_yaml",  # G2
    "rig.workspace.orca_cli -> rig.devenv.ui",  # G2 (shared console helpers to a leaf module)
    "rig.image_drift.server -> rig.connectivity.web",  # G2 (the web host mounts routes from rig_cli)
    "rig.image_drift.server -> rig.triage.web",  # G2 (the web host mounts routes from rig_cli)
    "rig.repo_governance.cli_audits -> rig.workspace.engine",  # G2
    "rig.repo_governance.cli_audits -> rig.workspace.vercel_names",  # G2 (move the module)
    "rig.repo_governance.vercel_projects -> rig.workspace.vercel_names",  # G2 (move the module)
    "rig.workspace.orca_agent_permissions -> rig.estate.orca_runtime",  # G2 (move the module)
]

[tool.ruff]
line-length = 120
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "B", "I", "N", "UP", "PL", "C90", "T20", "SIM", "ARG", "PTH", "ERA", "TID251", "BLE001", "DTZ", "S602", "PGH004"]
ignore = [
    "PLR0913", # Too many arguments
    "PLR0915", # Too many statements
    "PLR2004", # Magic value comparison
    "B008",    # Typer Option/Argument calls in defaults — standard Typer CLI pattern
    "PLC0415", # Lazy imports inside CLI commands — intentional for fast startup
    "C901",    # Complex functions — existing logic, refactor separately
    "PLR0912", # Too many branches — existing logic, refactor separately
    "PLR0911", # Too many return statements — existing logic, refactor separately
    "PLW1510", # subprocess.run without check= — many are fire-and-forget
    "ARG001",  # Unused function argument — interface-compliance signatures
    "PLW2901", # Loop variable overwritten — intentional line.strip() patterns
]

[tool.ruff.lint.per-file-ignores]
# Test doubles use interface-compliant mock signatures and lambda stubs whose
# arguments are intentionally unused; mirrors the global ARG001 rationale.
"tests/**" = ["ARG002", "ARG005", "PLW0108", "BLE001", "DTZ"]
"typings/**" = ["N801", "N802", "N803", "N815", "N816", "F403", "TID251"]
"**/*_windows.py" = ["TID251"]
"**/windows/**" = ["TID251"]
"src/desktop_manager/win32/*.py" = ["TID251"]
"src/desktop_manager/display_guard.py" = ["TID251"]
"src/desktop_manager/claude_sessions/wt_uia.py" = ["TID251"]
