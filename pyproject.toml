[tool.ruff.lint.mccabe]
max-complexity = 10

[tool.basedpyright]
include = ["src", "packages/type-ratchet/src"]
typeCheckingMode = "strict"
reportExplicitAny = "error"
reportAny = "error"
reportIgnoreCommentWithoutRule = "error"
reportImplicitOverride = "error"
reportUnannotatedClassAttribute = "error"
reportImportCycles = "error"
reportUninitializedInstanceVariable = "error"
reportUnusedParameter = "error"
reportPrivateLocalImportUsage = "error"
pythonVersion = "3.13"
reportMissingImports = true
reportMissingTypeStubs = false
reportMissingModuleSource = false
executionEnvironments = [
    { root = "src", extraPaths = ["src"] },
    { root = "packages/type-ratchet/src", extraPaths = ["packages/type-ratchet/src"] },
]

[tool.ty.environment]
python-version = "3.13"
python-platform = "all"

[tool.ty.analysis]
replace-imports-with-any = [
    "comtypes.**",
    "pywintypes",
    "win32api",
    "win32com.**",
    "win32con",
    "win32gui",
    "win32event",
    "win32process",
    "win32ts",
    "pyvda",
]

[tool.ty.terminal]
error-on-warning = true
output-format = "concise"

[tool.mdformat]
wrap = 120
end_of_line = "lf"

[tool.coverage.run]
source = ["src"]
branch = true
omit = [
    "*/__init__.py",
    "*/__pycache__/*",
    # Win32 and UI Automation adapters: they only drive the live Windows desktop, so the Linux
    # job cannot run them and they would sit in its denominator as permanent misses. Keep logic
    # out of them; anything testable belongs in a module that stays measured here.
    "src/desktop_manager/chrome/input_windows.py",
    "src/desktop_manager/chrome/uia.py",
    "src/desktop_manager/chrome/uia_core.py",
    "src/desktop_manager/claude_sessions/wt_uia.py",
    "src/desktop_manager/display_guard_windows.py",
    "src/desktop_manager/jobs/session_windows.py",
    "src/desktop_manager/service_installer.py",
    "src/desktop_manager/win32/align_ports.py",
    "src/desktop_manager/win32/inventory.py",
]

[tool.coverage.report]
# The floor. A ratchet (rig.repo_governance.coverage_floor, run in CI) stops it falling and
# makes it follow coverage up to [tool.rig.coverage_ratchet] target. See docs/testing.md.
fail_under = 81
show_missing = true
skip_covered = true
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "if TYPE_CHECKING:",
    "raise NotImplementedError",
    "if __name__ == .__main__.:",
]

[tool.rig.coverage_ratchet]
target = 95  # the hard floor this ratchets towards
slack = 2  # points coverage may sit above the floor before the floor must rise

# Mutation testing: `uv run --with mutmut mutmut run`, then `... mutmut results`. Scoped to
# pure, invariant-rich modules whose tests run in seconds; widen one module at a time and keep
# the selection to the tests that exercise it. See docs/testing.md.
[tool.mutmut]
source_paths = [
    "src/desktop_manager/placement.py",
    "src/rig/repo_governance/gitignore_manager.py",
    "src/rig/typed_json.py",
    "src/rig/image_drift/simplifier/syntactic.py",
    "src/rig/workspace/layout.py",
]
also_copy = ["tests/", "desktop-manager/", "src/", "typings/", "config/", "data/", "assets/"]
pytest_add_cli_args = ["-p", "no:xdist", "-p", "no:cacheprovider", "-q"]
pytest_add_cli_args_test_selection = [
    "tests/desktop_manager/test_placement_pure.py",
    "tests/desktop_manager/test_placement_properties.py",
    "tests/desktop_manager/test_workspace_align.py",
    "tests/test_gitignore_manager.py",
    "tests/test_gitignore_manager_mutants.py",
    "tests/test_workspace_layout.py",
    "tests/test_typed_json.py",
    "tests/test_svg_syntactic_minifier.py",
]

[tool.repo-health.ratchet]
paths = ["src", "packages/type-ratchet/src"]
hint = "Remove them. See docs/python-types.md for the replacements."
# The test-side rules gate tests/ only: src/ has no fakes, and its two sys.modules writes are a
# compat alias and a module loader, not test doubles.
disable = ["fake-location", "patching"]
# Today's test files that define fakes outside tests/fakes/ or patch modules (F3, #411). Lists only
# shrink: move a fake into tests/fakes/, or replace a patch with a fake passed through a seam.
fake-location-allow = [
    "tests/desktop_manager/fake_chrome.py",
    "tests/desktop_manager/integration/test_workspace_restore.py",
    "tests/desktop_manager/test_chrome_macos_grouping.py",
    "tests/desktop_manager/test_claude_sessions_backends.py",
    "tests/desktop_manager/test_claude_sessions_plan_apply.py",
    "tests/desktop_manager/test_claude_sessions_startup.py",
    "tests/desktop_manager/test_display_guard.py",
    "tests/desktop_manager/test_projects.py",
    "tests/desktop_manager/test_runtime.py",
    "tests/desktop_manager/test_windows_workspace_unit.py",
    "tests/desktop_manager/test_work_items.py",
    "tests/desktop_manager/test_workspace_align.py",
    "tests/desktop_manager/test_workspace_wait_scope.py",
    "tests/desktop_manager/test_workspace_win32_behavior.py",
    "tests/test_c4_okf.py",
    "tests/test_estate_caches.py",
    "tests/test_estate_orca.py",
    "tests/test_estate_prs.py",
    "tests/test_estate_web.py",
    "tests/test_estate_wrapup.py",
    "tests/test_otel_clickhouse.py",
    "tests/test_otel_web.py",
    "tests/test_web_ops_spa.py",
    "tests/test_workspace_packages.py",
]
patching-allow = [
    "tests/conftest.py",
    "tests/desktop_manager/conftest.py",
    "tests/desktop_manager/integration/conftest.py",
    "tests/desktop_manager/integration/test_desktop_placement.py",
