# tracing.run is the one executor that rig.proc and every other caller goes through;
# type-ratchet is a stdlib-only package that cannot import rig.
"src/rig/tracing.py" = ["TID251"]
"packages/type-ratchet/**" = ["TID251"]
# Temporary: callers that still spawn processes directly. Each entry goes when its
# file moves onto rig.tracing.run / rig.proc; G4 deletes whatever is left.
# Removed by C10 (installers):
"src/desktop_manager/chrome/install.py" = ["TID251"]
