"comtypes".msg = "Windows-only: use it in a Windows module (win32/, *_windows.py, windows/) listed in ruff per-file-ignores, or behind `sys.platform == \"win32\"` with `# noqa: TID251`"
"ctypes.WINFUNCTYPE".msg = "Windows-only: use it in a Windows module (win32/, *_windows.py, windows/) listed in ruff per-file-ignores, or behind `sys.platform == \"win32\"` with `# noqa: TID251`"
"ctypes.WinDLL".msg = "Windows-only: use it in a Windows module (win32/, *_windows.py, windows/) listed in ruff per-file-ignores, or behind `sys.platform == \"win32\"` with `# noqa: TID251`"
"ctypes.oledll".msg = "Windows-only: use it in a Windows module (win32/, *_windows.py, windows/) listed in ruff per-file-ignores, or behind `sys.platform == \"win32\"` with `# noqa: TID251`"
"ctypes.windll".msg = "Windows-only: use it in a Windows module (win32/, *_windows.py, windows/) listed in ruff per-file-ignores, or behind `sys.platform == \"win32\"` with `# noqa: TID251`"
"msvcrt".msg = "Windows-only: use it in a Windows module (win32/, *_windows.py, windows/) listed in ruff per-file-ignores, or behind `sys.platform == \"win32\"` with `# noqa: TID251`"
"pythoncom".msg = "Windows-only: use it in a Windows module (win32/, *_windows.py, windows/) listed in ruff per-file-ignores, or behind `sys.platform == \"win32\"` with `# noqa: TID251`"
"pyvda".msg = "Windows-only: use it in a Windows module (win32/, *_windows.py, windows/) listed in ruff per-file-ignores, or behind `sys.platform == \"win32\"` with `# noqa: TID251`"
"pywinauto".msg = "Windows-only: use it in a Windows module (win32/, *_windows.py, windows/) listed in ruff per-file-ignores, or behind `sys.platform == \"win32\"` with `# noqa: TID251`"
"pywintypes".msg = "Windows-only: use it in a Windows module (win32/, *_windows.py, windows/) listed in ruff per-file-ignores, or behind `sys.platform == \"win32\"` with `# noqa: TID251`"
"uiautomation".msg = "Windows-only: use it in a Windows module (win32/, *_windows.py, windows/) listed in ruff per-file-ignores, or behind `sys.platform == \"win32\"` with `# noqa: TID251`"
"win32api".msg = "Windows-only: use it in a Windows module (win32/, *_windows.py, windows/) listed in ruff per-file-ignores, or behind `sys.platform == \"win32\"` with `# noqa: TID251`"
"win32com".msg = "Windows-only: use it in a Windows module (win32/, *_windows.py, windows/) listed in ruff per-file-ignores, or behind `sys.platform == \"win32\"` with `# noqa: TID251`"
"win32con".msg = "Windows-only: use it in a Windows module (win32/, *_windows.py, windows/) listed in ruff per-file-ignores, or behind `sys.platform == \"win32\"` with `# noqa: TID251`"
"win32event".msg = "Windows-only: use it in a Windows module (win32/, *_windows.py, windows/) listed in ruff per-file-ignores, or behind `sys.platform == \"win32\"` with `# noqa: TID251`"
"win32gui".msg = "Windows-only: use it in a Windows module (win32/, *_windows.py, windows/) listed in ruff per-file-ignores, or behind `sys.platform == \"win32\"` with `# noqa: TID251`"
"win32process".msg = "Windows-only: use it in a Windows module (win32/, *_windows.py, windows/) listed in ruff per-file-ignores, or behind `sys.platform == \"win32\"` with `# noqa: TID251`"
"winreg".msg = "Windows-only: use it in a Windows module (win32/, *_windows.py, windows/) listed in ruff per-file-ignores, or behind `sys.platform == \"win32\"` with `# noqa: TID251`"
"subprocess.Popen".msg = "Run processes through rig.proc (git/gh) or rig.tracing.run, so every call is a span with stdin closed"
"subprocess.call".msg = "Run processes through rig.proc (git/gh) or rig.tracing.run, so every call is a span with stdin closed"
"subprocess.check_call".msg = "Run processes through rig.proc (git/gh) or rig.tracing.run, so every call is a span with stdin closed"
"subprocess.check_output".msg = "Run processes through rig.proc (git/gh) or rig.tracing.run, so every call is a span with stdin closed"
"subprocess.run".msg = "Run processes through rig.proc (git/gh) or rig.tracing.run, so every call is a span with stdin closed"

[tool.ruff.lint.mccabe]
max-complexity = 10

[tool.basedpyright]
include = ["src", "packages/type-ratchet/src"]
typeCheckingMode = "strict"
reportExplicitAny = "error"
reportAny = "error"
reportIgnoreCommentWithoutRule = "error"
reportImplicitOverride = "error"
reportUnannotatedClassAttribute = "error"
reportImportCycles = "error"
reportUninitializedInstanceVariable = "error"
reportUnusedParameter = "error"
reportPrivateLocalImportUsage = "error"
pythonVersion = "3.13"
reportMissingImports = true
reportMissingTypeStubs = false
reportMissingModuleSource = false
executionEnvironments = [
    { root = "src", extraPaths = ["src"] },
    { root = "packages/type-ratchet/src", extraPaths = ["packages/type-ratchet/src"] },
]

[tool.ty.environment]
python-version = "3.13"
python-platform = "all"

[tool.ty.terminal]
error-on-warning = true
output-format = "concise"

[tool.mdformat]
wrap = 120
end_of_line = "lf"

[tool.coverage.run]
source = ["src"]
branch = true
omit = [
    "*/__init__.py",
    "*/__pycache__/*",
]

[tool.coverage.report]
# The floor. A ratchet (rig.repo_governance.coverage_floor, run in CI) stops it falling and
# makes it follow coverage up to [tool.rig.coverage_ratchet] target. See docs/testing.md.
fail_under = 90
show_missing = true
skip_covered = true
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "if TYPE_CHECKING:",
    "raise NotImplementedError",
    "if __name__ == .__main__.:",
]

[tool.rig.coverage_ratchet]
target = 95  # the hard floor this ratchets towards
slack = 2  # points coverage may sit above the floor before the floor must rise

# Mutation testing: `uv run --with mutmut mutmut run`, then `... mutmut results`. Scoped to
# pure, invariant-rich modules whose tests run in seconds; widen one module at a time and keep
# the selection to the tests that exercise it. See docs/testing.md.
[tool.mutmut]
source_paths = [
    "src/rig/typed_json.py",
]
also_copy = ["tests/", "desktop-manager/", "src/", "typings/", "config/", "assets/"]
pytest_add_cli_args = ["-p", "no:xdist", "-p", "no:cacheprovider", "-q"]
pytest_add_cli_args_test_selection = [
    "tests/test_typed_json.py",
]

[tool.repo-health.ratchet]
paths = ["src", "packages/type-ratchet/src"]
hint = "Remove them. See docs/python-types.md for the replacements."
# The test-side rules gate tests/ only: src/ has no fakes, and its two sys.modules writes are a
# compat alias and a module loader, not test doubles.
disable = ["fake-location", "patching"]
# Today's test files that define fakes outside tests/fakes/ or patch modules (F3, #411). Lists only
# shrink: move a fake into tests/fakes/, or replace a patch with a fake passed through a seam.
fake-location-allow = [
    "tests/desktop_manager/test_runtime.py",
    "tests/test_c4_okf.py",
]
patching-allow = [
    "tests/conftest.py",
    "tests/desktop_manager/test_runtime.py",
    "tests/test_c4_okf.py",
]
pyright-pragma-allow = []
boundary-modules = [
    "src/rig/typed_json.py",
    "src/rig/typed_yaml.py",
    "packages/type-ratchet/src/type_ratchet/config.py",
]
str-key-receivers = ["self.headers", "handler.headers"]
loose-dict-aliases = ["JsonObject"]
loose-dict-allow = [
    "src/rig/tracing.py",
]

# tests/ gates only the test-side rules (docs/testing.md#shared-fakes-and-steps). Fakes live in
# tests/fakes/, which may patch while the allowlist below shrinks; the first matching set wins.
[[tool.repo-health.ratchet.rule-sets]]
files = ["tests/fakes/*"]
rules = ["patching"]

[[tool.repo-health.ratchet.rule-sets]]
files = ["tests/*"]
rules = ["fake-location", "patching"]
